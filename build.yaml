changelog: >
  Prevent name cleanup rules from erasing a title. When a cleanup rule reduces a non-empty provider name to nothing (for example a greedy ".*NL.*" rule), the original title is kept instead of exporting an "Unknown" folder. Also ignore empty or placeholder provider series names, falling back to the series-info name or a title derived from the episode titles.
